name: Build desktop release

# 发布 Linux 安装包：Go+MyGo 桌面外壳、Bun 服务、PyInstaller 打包的 compute 三件套，
# 由 scripts/build/build-app.sh 串起来（与本地手工打包完全同一条路径）。
#
# 触发：
#   - 推 v* 标签：用标签名当版本，与 desktop/mygo.json 的 version 必须一致，直接建 Release。
#   - 手动 dispatch：填 version（可选），产物先挂成 draft，确认后再手动发布。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without v prefix, for example 0.1.0 (default: desktop/mygo.json)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  BUN_VERSION: "1.4.4"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: compute/requirements.txt
      - name: Install packaging tools
        # mygo 用 purego 在运行期加载 GTK/WebKitGTK（不参与编译），但 deb 的依赖声明与冒烟测试要用到它们。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 xvfb dbus-x11 fakeroot dpkg-dev
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Create the compute virtualenv
        # build-app.sh 与 bundle-compute.sh 默认用仓库根的 .venv；PyInstaller 只是打包期工具，不入 requirements。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r compute/requirements.txt
          .venv/bin/python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Resolve the version
        run: |
          packaged="$(python -c 'import json;print(json.load(open("desktop/mygo.json"))["version"])')"
          version="${{ github.event.inputs.version || '' }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ] || [ "$version" = "main" ]; then
            version="$packaged"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid package version: $version" >&2
            exit 2
          fi
          if [ "$version" != "$packaged" ]; then
            echo "Version $version does not match desktop/mygo.json ($packaged); bump it in the same commit as the tag." >&2
            exit 2
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
            echo "DRAFT_FLAG=" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
            echo "DRAFT_FLAG=--draft" >> "$GITHUB_ENV"
          fi
      - name: Build the app and its installers
        run: scripts/build/build-app.sh
      - name: Verify the bundle
        # 安装包里必须同时有服务与 compute 两个可执行文件，图表库也要在；服务与 compute 各自能起来。
        run: |
          set -euo pipefail
          res=desktop/resources/linux-amd64
          for f in "$res/bin/datawhisper-server" "$res/bin/datawhisper-compute" \
                   "$res/static/vendor/plotly.min.js" "$res/static/vendor/echarts.min.js"; do
            test -s "$f" || { echo "missing from the bundle: $f" >&2; exit 2; }
          done
          test -n "$(find desktop/build -maxdepth 2 -name '*.deb' -print -quit)" || {
            echo "no .deb was produced" >&2
            exit 2
          }
          tmp="$(mktemp -d)"
          # 服务：stdout 第一行是 ready 记录，读到 EOF 就优雅退出。
          DW_DATA_DIR="$tmp" "$res/bin/datawhisper-server" < /dev/null > "$tmp/server.out" 2> "$tmp/server.err" || true
          head -5 "$tmp/server.out" "$tmp/server.err"
          grep -q '"type"[[:space:]]*:[[:space:]]*"ready"' "$tmp/server.out" || {
            echo "the bundled server did not report ready" >&2
            exit 2
          }
          # compute：发一条 ping 走完整的 JSON-RPC 通路；输出原样打出来，失败时不用再翻日志找原因。
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' \
            | timeout 120 "$res/bin/datawhisper-compute" > "$tmp/compute.out" 2> "$tmp/compute.err" || true
          head -5 "$tmp/compute.out" "$tmp/compute.err"
          grep -q '"id"[[:space:]]*:[[:space:]]*1' "$tmp/compute.out" || {
            echo "the bundled compute did not answer ping" >&2
            exit 2
          }
      - name: Checksums
        run: |
          cd desktop/build/linux-amd64
          sha256sum ./*.deb ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-package
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/build/linux-amd64/*.deb
            desktop/build/linux-amd64/*.tar.gz
            desktop/build/linux-amd64/SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Resolve the release tag
        run: |
          version="${{ github.event.inputs.version || '' }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ] || [ "$version" = "main" ]; then
            version="$(python3 -c 'import json;print(json.load(open("desktop/mygo.json"))["version"])')"
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "DRAFT_FLAG=" >> "$GITHUB_ENV"
          else
            echo "DRAFT_FLAG=--draft" >> "$GITHUB_ENV"
          fi
      - name: Collect assets
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort
          mkdir -p release-upload
          while IFS= read -r file; do
            cp "$file" "release-upload/$(basename "$file")"
          done < <(find release-artifacts -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name 'SHA256SUMS' \) | sort)
          test -n "$(ls -A release-upload)" || { echo "no release assets" >&2; exit 2; }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "本机单用户桌面数据分析应用。安装包含桌面外壳、agent 服务与计算进程，不依赖外网服务。"
            echo
            echo "更新说明见仓库的 CHANGELOG.md。"
            echo
            echo '```'
            cat release-upload/SHA256SUMS
            echo '```'
          } > "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes"
            while IFS= read -r asset; do
              case "$asset" in
                *.deb|*.tar.gz|SHA256SUMS) ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" -y ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" release-upload/* --clobber
          else
            gh release create "$RELEASE_TAG" release-upload/* $DRAFT_FLAG \
              --title "$RELEASE_TAG" \
              --target ${{ github.sha }} \
              --notes-file "$notes"
          fi
